<text x="32" y="75" fill="#adc8d3" font-family="Arial" font-size="14">Correct the constraint along the noisy trajectory.</text><text x="636" y="75" fill="#c9c0ae" font-family="Arial" font-size="14">Evaluate physics only on a complete clean rollout.</text><rect x="34" y="110" width="150" height="66" rx="12" fill="#173b49" stroke="#388c9c"/><text x="109" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Noisy Xₜ</text><text x="109" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">diffusion state</text><rect x="219" y="110" width="150" height="66" rx="12" fill="#173b49" stroke="#388c9c"/><text x="294" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Posterior moments</text><text x="294" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">μₜ and Σₜ</text><rect x="405" y="110" width="152" height="66" rx="12" fill="#173b49" stroke="#388c9c"/><text x="481" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Scale PDE</text><text x="481" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">Rₜ(μₜ, Σₜ)</text><path d="M185 142 H216 M370 142 H402" stroke="#6bdecf" stroke-width="2.4" marker-end="url(#arr)"/><rect x="155" y="227" width="280" height="69" rx="12" fill="#18483f" stroke="#52bda4"/><text x="295" y="252" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Stepwise physics guidance</text><text x="295" y="274" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">update reverse sampling score</text><path d="M480 177 V204 H295 V224" stroke="#6bdecf" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="34" y="342" fill="#78d6c6" font-family="Arial" font-size="14">Challenge: conditional covariance / closure</text><rect x="637" y="110" width="149" height="66" rx="12" fill="#493925" stroke="#c79552"/><text x="711.5" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Initial latent z</text><text x="711.5" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">optimization variable</text><rect x="823" y="110" width="150" height="66" rx="12" fill="#493925" stroke="#c79552"/><text x="898" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Full DDIM map</text><text x="898" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">clean 4D sequence</text><rect x="1010" y="110" width="151" height="66" rx="12" fill="#493925" stroke="#c79552"/><text x="1085.5" y="135" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Physics + data</text><text x="1085.5" y="157" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">loss on X₀</text><path d="M787 142 H820 M974 142 H1007" stroke="#e4b36a" stroke-width="2.4" marker-end="url(#arr)"/><rect x="756" y="230" width="282" height="67" rx="12" fill="#4b3927" stroke="#c79552"/><text x="897" y="255" text-anchor="middle" fill="#e5f3ff" font-family="Arial" font-size="15" font-weight="700">Backprop to initial z</text><text x="897" y="277" text-anchor="middle" fill="#b5c9dc" font-family="Arial" font-size="12">repeat until objective improves</text><path d="M1085 177 V204 H897 V227 M758 266 H698 V176" stroke="#e4b36a" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="637" y="342" fill="#ecc28e" font-family="Arial" font-size="14">Challenge: full-trajectory gradients / compute</text></svg>